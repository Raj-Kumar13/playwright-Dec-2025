name: Playwright Tests
on:
  push:
    branches: [ develop ] # on event triggering branch
  pull_request:
    branches: [develop ] # on event triggering branch
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      # 1 Checkout the repository
    - name: Checkout repository  
      uses: actions/checkout@v4
      #2 Setup Node.js and Install dependencies
    - name: Setup Node.js  
      uses: actions/setup-node@v4
      with:
        node-version: 20 #lts/* - this regExp means latest LTS version
      #3 Install dependencies and Run Playwright tests    
    - name: Install dependencies
      run: npm ci
      #4 Install Playwright browsers, Run tests and Upload report artifact
    - name: Install Playwright Browsers
      run: npx playwright install chromium chrome msedge firefox webkit--with-deps
      #5 Run Playwright tests and upload report
    - name: Run Playwright tests
      run: npx playwright test
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
